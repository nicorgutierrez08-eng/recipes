name: Deploy to GitHub Pages

# Builds the Astro site and publishes it to GitHub Pages whenever you push to
# `main` (e.g. after merging your recipe changes). You can also run it by hand
# from the Actions tab via "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the deploy needs to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run cancel an in-progress one, but never cancel a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
