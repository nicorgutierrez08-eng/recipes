<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a slice of chocolate cake">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7C6A0"/>
      <stop offset="1" stop-color="#C99A6B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg4)"/>
  <!-- plate -->
  <ellipse cx="400" cy="430" rx="260" ry="60" fill="#F2EADC"/>
  <!-- cake slice -->
  <path d="M300 430 L400 200 L500 430 Z" fill="#4A2C22"/>
  <path d="M300 430 L400 200 L430 200 L330 430 Z" fill="#5E3A2C"/>
  <!-- crumb layers -->
  <path d="M330 360 L470 360" stroke="#6E4635" stroke-width="6"/>
  <path d="M345 320 L455 320" stroke="#6E4635" stroke-width="5"/>
  <!-- top ganache -->
  <path d="M400 200 q10 15 30 22 q-15 12 -30 10 q-15 2 -30 -10 q20 -7 30 -22 Z" fill="#2E1B14"/>
  <!-- flaky salt -->
  <g fill="#F4ECDD"><circle cx="392" cy="232" r="3"/><circle cx="408" cy="240" r="3"/><circle cx="400" cy="250" r="2.5"/></g>
  <!-- fork -->
  <g stroke="#B98A55" stroke-width="7" stroke-linecap="round">
    <path d="M600 300 L600 470"/>
    <path d="M580 300 L580 340 M600 300 L600 340 M620 300 L620 340"/>
    <path d="M560 340 q40 20 80 0" fill="none"/>
  </g>
</svg>
