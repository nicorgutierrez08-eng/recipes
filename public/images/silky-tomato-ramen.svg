<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a bowl of tomato ramen">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3C6A6"/>
      <stop offset="1" stop-color="#D98B63"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg2)"/>
  <!-- steam -->
  <g stroke="#F6E7D8" stroke-width="8" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M330 150 q-25 30 0 60 q25 30 0 60"/>
    <path d="M410 130 q-25 30 0 60 q25 30 0 60"/>
    <path d="M490 150 q-25 30 0 60 q25 30 0 60"/>
  </g>
  <!-- bowl -->
  <path d="M180 340 a220 200 0 0 0 440 0 Z" fill="#F4EAD8"/>
  <ellipse cx="400" cy="340" rx="220" ry="70" fill="#C4623C"/>
  <ellipse cx="400" cy="336" rx="205" ry="60" fill="#B24A2E"/>
  <!-- noodles -->
  <g fill="none" stroke="#F2CE7E" stroke-width="7" stroke-linecap="round">
    <path d="M300 330 q40 -30 80 0 q40 30 80 0"/>
    <path d="M290 348 q40 -30 80 0 q40 30 80 0"/>
    <path d="M320 362 q40 -25 80 0 q40 25 70 0"/>
  </g>
  <!-- egg -->
  <ellipse cx="330" cy="330" rx="42" ry="34" fill="#F7F0E0"/>
  <circle cx="330" cy="330" r="18" fill="#E7A83C"/>
  <!-- tofu cubes -->
  <rect x="450" y="312" width="34" height="34" rx="5" fill="#F5E6C8" transform="rotate(-8 467 329)"/>
  <rect x="490" y="330" width="30" height="30" rx="5" fill="#EFDCB6" transform="rotate(10 505 345)"/>
  <!-- scallion -->
  <circle cx="410" cy="322" r="7" fill="#6B7248"/>
  <circle cx="440" cy="336" r="7" fill="#7FA04A"/>
  <circle cx="360" cy="356" r="7" fill="#6B7248"/>
</svg>
